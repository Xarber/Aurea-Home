server {
    listen 80;
    server_name aurea.xcenter.it;
    return 301 https://aurea.xcenter.it$request_uri;
}
server {
    listen 443 ssl;
    server_name aurea.xcenter.it;
    ssl_certificate /etc/letsencrypt/live/xcenter.it-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xcenter.it-0002/privkey.pem;
    root /srv/xcenter/apps/aurea/current;
    index index.html;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location /peer/ {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }
    location ~ \.webmanifest$ { types { application/manifest+json webmanifest; } default_type application/manifest+json; try_files $uri =404; }
    location = /sw.js { add_header Cache-Control no-cache; }
    location = /index.html { add_header Cache-Control no-cache; }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
