name: UADS source quality
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [testing]
  pull_request:
    branches: [testing, beta, main]
permissions:
  contents: read
concurrency:
  group: uads-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install jsonschema==4.25.1
      - run: python scripts/validate-uads.py
  testing-source:
    if: github.workflow == 'UADS source quality' && (github.base_ref == 'testing' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck && npm test && npm --prefix server test && scripts/check-host.sh
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix server audit --omit=dev --audit-level=high
