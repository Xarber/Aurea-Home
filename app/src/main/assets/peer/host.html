<!doctype html><html><head><meta name="viewport" content="width=device-width"><script src="https://aurea.xcenter.it/peer-client.js"></script></head><body><script>
// SPDX-License-Identifier: AGPL-3.0-only
// Fixed host and finite RPC surface. No commands, credentials or media enter signaling.
const peer=new Peer('__PEER_ID__',{host:'aurea.xcenter.it',port:443,path:'/peer',secure:true,key:'aurea',config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});
const links=new Map(),pending=new Map();let sequence=0;
const allowed=new Set(['hello','pair_start','pair','state','catalog','icon','artwork','key','launch','media','presence','revoke','system_connect','system_pair_begin','system_pair_finish','local_adb']);
peer.on('open',()=>AureaPeer.ready());peer.on('disconnected',()=>setTimeout(()=>{if(!peer.destroyed)peer.reconnect();},2000));
peer.on('connection',link=>{if(links.size>=4){link.close();return;}links.set(link.peer,link);let inFlight=0,windowAt=Date.now(),count=0;link.on('data',data=>{if(Date.now()-windowAt>1000){windowAt=Date.now();count=0;}if(++count>12||inFlight>=3||!data||typeof data!=='object'||typeof data.id!=='string'||data.id.length>32||!allowed.has(data.operation)||JSON.stringify(data).length>4096){link.close();return;}const id=String(++sequence);inFlight++;pending.set(id,{link,id:data.id,done:()=>inFlight--});AureaPeer.request(id,data.operation,JSON.stringify({...data.payload,...(data.token?{token:data.token}:{})}));});link.on('close',()=>{links.delete(link.peer);for(const[id,entry]of pending)if(entry.link===link)pending.delete(id);});});
window.aureaReply=(id,body)=>{const entry=pending.get(id);if(!entry)return;pending.delete(id);entry.done();if(entry.link.open)entry.link.send({id:entry.id,...(body.error?{error:body.error}:{result:body})});};
</script></body></html>
